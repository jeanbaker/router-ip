name: Update CNIP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 生成 IPv4
      - name: Generate IPv4 CNIP
        run: |
          URL="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/refs/heads/ip-lists/china.txt"

          {
            echo "/ip firewall address-list"
            echo "remove [find list=CNIP]"

            echo "add address=10.0.0.0/8 list=CNIP comment=private-network"
            echo "add address=172.16.0.0/12 list=CNIP comment=private-network"
            echo "add address=192.168.0.0/16 list=CNIP comment=private-network"

            curl -fsSL "$URL" |
            sed '/^[[:space:]]*$/d' |
            sed 's/\r$//' |
            while read ip
            do
              echo "add address=$ip list=CNIP"
            done

          } > cnip.rsc


      # 生成 IPv6
      - name: Generate IPv6 CNIP
        run: |
          URL="https://raw.githubusercontent.com/gaoyifan/china-operator-ip/refs/heads/ip-lists/china6.txt"

          {
            echo "/ipv6 firewall address-list"
            echo "remove [find list=CNIP]"

            echo "add address=fd00::/12 list=CNIP comment=private-network"

            curl -fsSL "$URL" |
            sed '/^[[:space:]]*$/d' |
            sed 's/\r$//' |
            while read ip
            do
              echo "add address=$ip list=CNIP"
            done

          } > cnipv6.rsc


      - name: Show result
        run: |
          echo "IPv4:"
          wc -l cnip.rsc

          echo "IPv6:"
          wc -l cnipv6.rsc


      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cnip.rsc cnipv6.rsc

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update CNIP IPv4 IPv6"
            git push
          fi
